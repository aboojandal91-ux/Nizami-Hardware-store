<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#6C00FF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="500" height="500" rx="90" fill="url(#darkBgGrad)" stroke="#1E293B" stroke-width="6"/>

  <!-- Subtle glow background halo -->
  <circle cx="250" cy="210" r="140" fill="#0088FF" opacity="0.18" filter="url(#glow)"/>

  <!-- Main Geometric Monogram "A" with stylized digital wings & hexagon motif -->
  <g transform="translate(0, -15)">
    <!-- Outer geometric hex/shield accents -->
    <path d="M 250 85 L 365 155 L 365 295 L 250 365 L 135 295 L 135 155 Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="7" 
          stroke-dasharray="16 8" 
          opacity="0.45" />

    <!-- Stylized Modern "A" Left Wing / Pillar -->
    <path d="M 250 115 L 160 290 L 205 290 L 235 230 L 250 230 Z" 
          fill="url(#primaryGrad)" 
          filter="url(#glow)" />

    <!-- Stylized Modern "A" Right Wing / Pillar -->
    <path d="M 250 115 L 340 290 L 295 290 L 265 230 L 250 230 Z" 
          fill="url(#accentGrad)" 
          filter="url(#glow)" />

    <!-- Central Tech Diamond / Core Node -->
    <polygon points="250,160 275,205 250,250 225,205" 
             fill="#FFFFFF" 
             filter="url(#glow)" />
    
    <!-- Central Cyan Accent Node -->
    <circle cx="250" cy="205" r="8" fill="#00E5FF" />

    <!-- Horizontal Connection Bridge / Crossbar -->
    <path d="M 180 260 L 320 260" 
          stroke="#00E5FF" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <!-- "Aboo's" -->
  <text x="250" y="380" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="2">
    Aboo<tspan fill="#00E5FF">'s</tspan>
  </text>

  <!-- Subtitle: "SOFTWARE MANAGEMENT SYSTEM" -->
  <text x="250" y="415" 
        text-anchor="middle" 
        fill="#94A3B8" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="4">
    SOFTWARE MANAGEMENT SYSTEM
  </text>

  <!-- Tagline: "ELEVATE • CONNECT • GROW" -->
  <text x="250" y="445" 
        text-anchor="middle" 
        fill="#38BDF8" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" 
        font-weight="800" 
        letter-spacing="5">
    ELEVATE • CONNECT • GROW
  </text>
</svg>
